name: Rust CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      description:
        description: 'Release description (optional)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # === CHANGELOG CHECK - only runs on PRs ===
  changelog:
    name: Changelog Fragment Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changelog fragments
        run: |
          # Get list of fragment files (excluding README)
          FRAGMENTS=$(find rust/changelog.d -name "*.md" ! -name "README.md" 2>/dev/null | wc -l)

          # Get changed files in PR
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          # Check if any Rust source files changed
          SOURCE_CHANGED=$(echo "$CHANGED_FILES" | grep -E "^rust/(src/|tests/|Cargo\.toml)" | wc -l)

          if [ "$SOURCE_CHANGED" -gt 0 ] && [ "$FRAGMENTS" -eq 0 ]; then
            echo "::warning::No changelog fragment found. Please add a changelog entry in rust/changelog.d/"
            echo ""
            echo "To create a changelog fragment:"
            echo "  Create a new .md file in rust/changelog.d/ with your changes"
            echo ""
            echo "See rust/changelog.d/README.md for more information."
            # Note: This is a warning, not a failure, to allow flexibility
            exit 0
          fi

          echo "✓ Changelog check passed"

  # === LINT AND FORMAT CHECK ===
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        working-directory: ./rust
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: ./rust
        run: cargo clippy --all-targets --all-features

  # === TEST ===
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changelog]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changelog.result == 'success' || needs.changelog.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        working-directory: ./rust
        run: cargo test --all-features --verbose

      - name: Run doc tests
        working-directory: ./rust
        run: cargo test --doc --verbose

  # === BUILD ===
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always() && needs.lint.result == 'success' && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build release
        working-directory: ./rust
        run: cargo build --release --verbose

      - name: Check package
        working-directory: ./rust
        run: cargo package --list

  # === AUTO RELEASE ===
  auto-release:
    name: Auto Release
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check if version already released
        id: version_check
        run: |
          # Get current version from Cargo.toml
          CURRENT_VERSION=$(grep -Po '(?<=^version = ")[^"]*' rust/Cargo.toml)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Check if tag exists
          if git rev-parse "rust-v$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "Tag rust-v$CURRENT_VERSION already exists, skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected: $CURRENT_VERSION"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Build release
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: ./rust
        run: cargo build --release

      - name: Create GitHub Release
        if: steps.version_check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version_check.outputs.current_version }}"
          TAG="rust-v$VERSION"

          echo "Creating GitHub release for $TAG..."

          # Create release
          gh release create "$TAG" \
            --title "Rust $VERSION" \
            --notes "Rust package release $VERSION" \
            --repo ${{ github.repository }}

          echo "✅ Created GitHub release: $TAG"

  # === MANUAL RELEASE ===
  manual-release:
    name: Manual Release
    needs: [lint, test, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          cd rust

          # Get current version
          OLD_VERSION=$(grep -Po '(?<=^version = ")[^"]*' Cargo.toml)
          echo "Current version: $OLD_VERSION"

          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"

          # Bump based on type
          case "${{ github.event.inputs.bump_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"

          # Update version in Cargo.toml
          sed -i "s/^version = \"$OLD_VERSION\"/version = \"$NEW_VERSION\"/" Cargo.toml

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Collect changelog fragments
        run: |
          cd rust
          # Check if there are any fragments to collect
          FRAGMENTS=$(find changelog.d -name "*.md" ! -name "README.md" 2>/dev/null | wc -l)
          if [ "$FRAGMENTS" -gt 0 ]; then
            echo "Found $FRAGMENTS changelog fragment(s)"

            # Create or update CHANGELOG.md
            if [ ! -f CHANGELOG.md ]; then
              echo "# Changelog" > CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi

            # Insert new version section at the top (after the header)
            VERSION="${{ steps.version.outputs.new_version }}"
            DATE=$(date +%Y-%m-%d)

            # Create temp file with new content
            {
              echo "# Changelog"
              echo ""
              echo "## $VERSION ($DATE)"
              echo ""
              # Concatenate all fragment files
              for f in changelog.d/*.md; do
                if [ "$(basename "$f")" != "README.md" ]; then
                  cat "$f"
                  echo ""
                fi
              done
              # Append old changelog content (skip the header)
              if [ -f CHANGELOG.md ]; then
                tail -n +3 CHANGELOG.md
              fi
            } > CHANGELOG.tmp

            mv CHANGELOG.tmp CHANGELOG.md

            # Delete collected fragments
            find changelog.d -name "*.md" ! -name "README.md" -delete
            echo "Changelog fragments collected and deleted"
          else
            echo "No changelog fragments found, skipping collection"
          fi

      - name: Commit version bump
        id: commit
        run: |
          git add rust/Cargo.toml rust/CHANGELOG.md rust/changelog.d/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "version_committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Rust ${{ steps.version.outputs.new_version }}" \
                       -m "" \
                       -m "${{ github.event.inputs.description || 'Manual release' }}" \
                       -m "" \
                       -m "🤖 Generated with [Claude Code](https://claude.com/claude-code)"

            git push origin main
            echo "version_committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Build release
        if: steps.commit.outputs.version_committed == 'true'
        working-directory: ./rust
        run: cargo build --release

      - name: Create GitHub Release
        if: steps.commit.outputs.version_committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          TAG="rust-v$VERSION"

          gh release create "$TAG" \
            --title "Rust $VERSION" \
            --notes "${{ github.event.inputs.description || 'Manual release' }}" \
            --repo ${{ github.repository }}

          echo "✅ Created GitHub release: $TAG"
