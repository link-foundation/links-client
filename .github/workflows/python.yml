name: Python CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'
      - 'experiments/test_python_release.py'
      - 'experiments/check_python_wheel.py'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'
      - 'experiments/test_python_release.py'
      - 'experiments/check_python_wheel.py'
  workflow_dispatch:
    inputs:
      publish_current:
        description: 'Publish the tested version on the selected ref without a version bump or branch push'
        required: false
        type: boolean
        default: false
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      description:
        description: 'Release description (optional)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # === CHANGELOG CHECK - only runs on PRs ===
  changelog:
    name: Changelog Fragment Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changelog fragments
        run: |
          # Get list of fragment files (excluding README)
          FRAGMENTS=$(find python/changelog.d -name "*.md" ! -name "README.md" 2>/dev/null | wc -l)

          # Get changed files in PR
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          # Check if any Python source files changed
          SOURCE_CHANGED=$(echo "$CHANGED_FILES" | grep -E "^python/(links_client/|tests/|pyproject\.toml)" | wc -l)

          if [ "$SOURCE_CHANGED" -gt 0 ] && [ "$FRAGMENTS" -eq 0 ]; then
            echo "::warning::No changelog fragment found. Please add a changelog entry in python/changelog.d/"
            echo ""
            echo "To create a changelog fragment:"
            echo "  Create a new .md file in python/changelog.d/ with your changes"
            echo ""
            echo "See python/changelog.d/README.md for more information."
            # Note: This is a warning, not a failure, to allow flexibility
            exit 0
          fi

          echo "✓ Changelog check passed"

  # Test Python
  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changelog]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changelog.result == 'success' || needs.changelog.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" PyYAML

      - name: Run unit tests without clink
        working-directory: ./python
        run: pytest -m "not integration"

      - name: Check Python release workflow
        run: python -m unittest discover -s experiments -p test_python_release.py -v

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install clink
        # Later releases reject the implicit references used by this client.
        # Keep in sync with the JavaScript integration job.
        run: dotnet tool install --global clink --version 2.2.2

      - name: Verify clink installation
        run: clink --version

      - name: Create test data directories
        run: |
          mkdir -p ./python/data
          mkdir -p ./data/auth-data/users
          mkdir -p ./data/menu-items

      - name: Run clink integration tests
        working-directory: ./python
        run: pytest -m integration

  # Build package - only runs if tests pass
  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-python]
    if: always() && needs.test-python.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        working-directory: ./python
        run: python -m build

      - name: Check package
        working-directory: ./python
        run: twine check dist/*

      - name: Verify installed wheel imports
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/pip" install python/dist/*.whl
          "$RUNNER_TEMP/wheel-check/bin/python" experiments/check_python_wheel.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/

  # Auto release on push to main (if version changed)
  auto-release:
    name: Auto Release
    needs: [test-python, build]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test-python.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Check if version changed
        id: version_check
        run: |
          # Get current version from pyproject.toml
          CURRENT_VERSION=$(grep -Po '(?<=^version = ")[^"]*' python/pyproject.toml)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Check if tag exists
          if git rev-parse "python-v$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "Tag python-v$CURRENT_VERSION already exists, skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected: $CURRENT_VERSION"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Download artifacts
        if: steps.version_check.outputs.should_release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: python/dist/

      - name: Publish to PyPI
        id: pypi_publish
        if: steps.version_check.outputs.should_release == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

      - name: Explain trusted publisher setup on failure
        if: failure() && steps.pypi_publish.outcome == 'failure'
        run: |
          echo "::error::If PyPI reports invalid-pending-publisher because links-client already exists, attach the publisher to the existing project at https://pypi.org/manage/project/links-client/settings/publishing/. Owner: link-foundation; repository: links-client; workflow: python.yml; environment: none. Then rerun the release. A pending new-project publisher is insufficient."

      - name: Create GitHub Release
        if: steps.version_check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version_check.outputs.current_version }}"
          TAG="python-v$VERSION"

          echo "Creating GitHub release for $TAG..."

          # Create release
          gh release create "$TAG" \
            --title "Python $VERSION" \
            --notes "Python package release $VERSION" \
            --repo ${{ github.repository }}

          echo "✅ Created GitHub release: $TAG"

  # Explicitly publish the tested version on the selected ref (including first releases).
  publish-current:
    name: Publish Current Version
    needs: [test-python, build]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish_current && needs.test-python.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download tested artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: python/dist/

      - name: Publish to PyPI
        id: pypi_publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

      - name: Explain trusted publisher setup on failure
        if: failure() && steps.pypi_publish.outcome == 'failure'
        run: |
          echo "::error::If PyPI reports invalid-pending-publisher because links-client already exists, attach the publisher to the existing project at https://pypi.org/manage/project/links-client/settings/publishing/. Owner: link-foundation; repository: links-client; workflow: python.yml; environment: none. Then rerun the release. A pending new-project publisher is insufficient."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -Po '(?<=^version = ")[^"]*' python/pyproject.toml)
          gh release create "python-v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Python $VERSION" \
            --notes "Python package release $VERSION" \
            --repo "${{ github.repository }}"

  # Manual version bump and release via workflow_dispatch, only on main.
  manual-release:
    name: Manual Release
    needs: [test-python, build]
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.publish_current && needs.test-python.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        working-directory: ./python
        run: |
          # Get current version
          OLD_VERSION=$(grep -Po '(?<=^version = ")[^"]*' pyproject.toml)
          echo "Current version: $OLD_VERSION"

          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"

          # Bump based on type
          case "${{ github.event.inputs.bump_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"

          # Update version in pyproject.toml
          sed -i "s/^version = \"$OLD_VERSION\"/version = \"$NEW_VERSION\"/" pyproject.toml

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Collect changelog fragments
        run: |
          cd python
          # Check if there are any fragments to collect
          FRAGMENTS=$(find changelog.d -name "*.md" ! -name "README.md" 2>/dev/null | wc -l)
          if [ "$FRAGMENTS" -gt 0 ]; then
            echo "Found $FRAGMENTS changelog fragment(s)"

            # Create or update CHANGELOG.md
            if [ ! -f CHANGELOG.md ]; then
              echo "# Changelog" > CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi

            # Insert new version section at the top (after the header)
            VERSION="${{ steps.version.outputs.new_version }}"
            DATE=$(date +%Y-%m-%d)

            # Create temp file with new content
            {
              echo "# Changelog"
              echo ""
              echo "## $VERSION ($DATE)"
              echo ""
              # Concatenate all fragment files
              for f in changelog.d/*.md; do
                if [ "$(basename "$f")" != "README.md" ]; then
                  cat "$f"
                  echo ""
                fi
              done
              # Append old changelog content (skip the header)
              if [ -f CHANGELOG.md ]; then
                tail -n +3 CHANGELOG.md
              fi
            } > CHANGELOG.tmp

            mv CHANGELOG.tmp CHANGELOG.md

            # Delete collected fragments
            find changelog.d -name "*.md" ! -name "README.md" -delete
            echo "Changelog fragments collected and deleted"
          else
            echo "No changelog fragments found, skipping collection"
          fi

      - name: Commit version bump
        id: commit
        run: |
          git add python/pyproject.toml python/CHANGELOG.md python/changelog.d/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "version_committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Python ${{ steps.version.outputs.new_version }}" \
                       -m "" \
                       -m "${{ github.event.inputs.description || 'Manual release' }}" \
                       -m "" \
                       -m "🤖 Generated with [Claude Code](https://claude.com/claude-code)"

            git push origin main
            echo "version_committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Build package
        if: steps.commit.outputs.version_committed == 'true'
        working-directory: ./python
        run: python -m build

      - name: Check package
        if: steps.commit.outputs.version_committed == 'true'
        working-directory: ./python
        run: twine check dist/*

      - name: Publish to PyPI
        id: pypi_publish
        if: steps.commit.outputs.version_committed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

      - name: Explain trusted publisher setup on failure
        if: failure() && steps.pypi_publish.outcome == 'failure'
        run: |
          echo "::error::If PyPI reports invalid-pending-publisher because links-client already exists, attach the publisher to the existing project at https://pypi.org/manage/project/links-client/settings/publishing/. Owner: link-foundation; repository: links-client; workflow: python.yml; environment: none. Then rerun the release. A pending new-project publisher is insufficient."

      - name: Create GitHub Release
        if: steps.commit.outputs.version_committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          TAG="python-v$VERSION"

          gh release create "$TAG" \
            --title "Python $VERSION" \
            --notes "${{ github.event.inputs.description || 'Manual release' }}" \
            --repo ${{ github.repository }}

          echo "✅ Created GitHub release: $TAG"
